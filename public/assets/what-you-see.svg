<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Four visualization mockups: a justification graph, a C4 system diagram, a topic map, and a risk matrix">
  <defs>
    <style>
      .panel { fill: #fafafa; stroke: #e4e4e7; stroke-width: 1; rx: 8; }
      .panel-title { fill: #18181b; font-family: Cambria, Georgia, serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .node { fill: #f59e0b; }
      .node-dark { fill: #27272a; }
      .node-red { fill: #dc2626; }
      .node-green { fill: #16a34a; }
      .edge { stroke: #a1a1aa; stroke-width: 1.5; fill: none; }
      .edge-broken { stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .label { fill: #52525b; font-family: Cambria, Georgia, serif; font-size: 9px; text-anchor: middle; }
      .label-light { fill: #fafafa; font-family: Cambria, Georgia, serif; font-size: 8px; text-anchor: middle; }
      .matrix-cell { stroke: #e4e4e7; stroke-width: 0.5; }
    </style>
  </defs>

  <!-- Panel 1: Goals justification graph -->
  <rect class="panel" x="20" y="20" width="370" height="170" />
  <text class="panel-title" x="205" y="45">Goals — Justification Graph</text>
  <line class="edge" x1="100" y1="80" x2="160" y2="130" />
  <line class="edge" x1="100" y1="80" x2="250" y2="130" />
  <line class="edge-broken" x1="320" y1="80" x2="320" y2="130" />
  <circle class="node" cx="100" cy="80" r="12" />
  <text class="label" x="100" y="83">G1</text>
  <circle class="node" cx="320" cy="80" r="12" />
  <text class="label" x="320" y="83">G2</text>
  <rect class="node-dark" x="140" y="120" width="40" height="22" rx="4" />
  <text class="label-light" x="160" y="134">F1</text>
  <rect class="node-dark" x="230" y="120" width="40" height="22" rx="4" />
  <text class="label-light" x="250" y="134">F2</text>
  <rect class="node-red" x="300" y="120" width="40" height="22" rx="4" />
  <text class="label-light" x="320" y="134">F3</text>
  <text class="label" x="320" y="160" style="fill:#dc2626">⚠ no justification</text>

  <!-- Panel 2: System C4 diagram -->
  <rect class="panel" x="410" y="20" width="370" height="170" />
  <text class="panel-title" x="595" y="45">System — C4 Diagram</text>
  <rect class="node-dark" x="450" y="75" width="80" height="35" rx="4" />
  <text class="label-light" x="490" y="97">Web App</text>
  <rect class="node-dark" x="660" y="75" width="80" height="35" rx="4" />
  <text class="label-light" x="700" y="97">API</text>
  <rect class="node" x="555" y="130" width="80" height="35" rx="4" />
  <text class="label" x="595" y="153">Database</text>
  <line class="edge" x1="530" y1="92" x2="660" y2="92" />
  <line class="edge" x1="700" y1="110" x2="595" y2="130" />
  <line class="edge" x1="490" y1="110" x2="595" y2="130" />

  <!-- Panel 3: Glossary topic map -->
  <rect class="panel" x="20" y="210" width="370" height="170" />
  <text class="panel-title" x="205" y="235">Glossary — Topic Map</text>
  <circle class="node" cx="100" cy="280" r="14" />
  <text class="label" x="100" y="283">dosage</text>
  <circle class="node" cx="200" cy="260" r="14" />
  <text class="label" x="200" y="263">alert</text>
  <circle class="node" cx="280" cy="300" r="14" />
  <text class="label" x="280" y="303">allergy</text>
  <circle class="node-red" cx="330" cy="260" r="10" />
  <text class="label" x="330" y="263" style="fill:#dc2626">orphan</text>
  <line class="edge" x1="114" y1="275" x2="186" y2="265" />
  <line class="edge" x1="214" y1="265" x2="266" y2="295" />
  <text class="label" x="205" y="350">term with no occurrences = orphan</text>

  <!-- Panel 4: Risk matrix -->
  <rect class="panel" x="410" y="210" width="370" height="170" />
  <text class="panel-title" x="595" y="235">Risks — Probability × Impact</text>
  <!-- Matrix grid -->
  <rect class="matrix-cell" x="470" y="260" width="40" height="30" fill="#16a34a" />
  <rect class="matrix-cell" x="510" y="260" width="40" height="30" fill="#16a34a" />
  <rect class="matrix-cell" x="550" y="260" width="40" height="30" fill="#f59e0b" />
  <rect class="matrix-cell" x="470" y="290" width="40" height="30" fill="#16a34a" />
  <rect class="matrix-cell" x="510" y="290" width="40" height="30" fill="#f59e0b" />
  <rect class="matrix-cell" x="550" y="290" width="40" height="30" fill="#dc2626" />
  <rect class="matrix-cell" x="470" y="320" width="40" height="30" fill="#f59e0b" />
  <rect class="matrix-cell" x="510" y="320" width="40" height="30" fill="#dc2626" />
  <rect class="matrix-cell" x="550" y="320" width="40" height="30" fill="#dc2626" />
  <text class="label" x="490" y="305" style="fill:#fafafa">R1</text>
  <text class="label" x="530" y="335" style="fill:#fafafa">R2</text>
  <text class="label" x="570" y="275" style="fill:#fafafa">R3</text>
  <text class="label" x="450" y="275">Low</text>
  <text class="label" x="450" y="305">Med</text>
  <text class="label" x="450" y="335">High</text>
  <text class="label" x="490" y="365">Low</text>
  <text class="label" x="530" y="365">Med</text>
  <text class="label" x="570" y="365">High</text>
</svg>
